{{/*
El header de las tres vistas. Vive en un solo archivo porque si no, agregar una
vista es acordarse de tocar tres plantillas — y la que se olvida es la que
queda sin salida.

El CSS va en un define aparte y no en un <style> propio: las tres plantillas ya
tienen el suyo en el <head>, y un <style> suelto en el <body> es válido de
casualidad. Cada una lo incluye con {{ template "nav-css" }}.
*/}}

{{ define "nav-css" }}
  .nav { display: flex; gap: 1.25rem; align-items: baseline; font-size: .9rem;
         margin: 0 0 1.25rem; padding-bottom: .55rem;
         border-bottom: 1px solid var(--borde); }
  .nav a { color: inherit; text-decoration: none; opacity: .5; }
  .nav a:hover { opacity: .85; }
  .nav a.activo { opacity: 1; font-weight: 600; }
  .nav .externo::after { content: " \2197"; font-size: .8em; opacity: .6; }
  /* El toggle de idioma era una sola letra gris al 50 % pegada al borde: el
     idioma SÍ cambiaba, pero no había forma de darse cuenta de que eso era un
     control. Segmentado, con borde y el activo marcado, se lee como un botón. */
  .nav .idiomas { margin-left: auto; display: inline-flex; border: 1px solid var(--borde);
                  border-radius: .4rem; overflow: hidden; }
  .nav .idiomas a { padding: .15rem .5rem; font-size: .75rem; letter-spacing: .05em;
                    opacity: .5; }
  .nav .idiomas a + a { border-left: 1px solid var(--borde); }
  .nav .idiomas a.activo { opacity: 1; font-weight: 600; background: #8882; }
{{ end }}

{{ define "nav" }}
<nav class="nav">
  <a href="/?horas={{ .Horas }}"{{ if eq .Activo "panel" }} class="activo" aria-current="page"{{ end }}>panel</a>
  <a href="/events?horas={{ .Horas }}"{{ if eq .Activo "events" }} class="activo" aria-current="page"{{ end }}>{{ t "nav-eventos" }}</a>
  <a href="/logs?horas={{ .Horas }}{{ with .Container }}&amp;container={{ . }}{{ end }}"{{ if eq .Activo "logs" }} class="activo" aria-current="page"{{ end }}>logs</a>
  {{/* El tail no existe sin un container elegido: ofrecerlo igual es un 400
       esperando a pasar. */}}
  {{- with .Container }}
  <a href="/logs/tail?container={{ . }}"{{ if eq $.Activo "tail" }} class="activo" aria-current="page"{{ end }}>tail · {{ . }}</a>
  {{- end }}
  {{/* Accesos que este proceso NO atiende: la terminal y la pantalla viven en
       Cockpit y en Guacamole, que tienen su propio login. Acá adentro no puede
       haber una terminal — el panel no pide contraseña y el proceso habla con
       el socket de Docker. Salen de la config porque la URL lleva la IP de
       tailnet. target=_blank para no perder la vista que uno estaba mirando. */}}
  {{- range .Enlaces }}
  <a class="externo" href="{{ .URL }}" target="_blank" rel="noopener">{{ .Nombre }}</a>
  {{- end }}
  {{/* Los dos idiomas, siempre visibles, con el activo marcado: así se ve que
       es un control y en qué estado está. Reescriben ?lang= sobre la URL actual
       por JS y no con un href fijo — un link armado en el server perdería q,
       container, desde/hasta y el tope. El server guarda la elección en la
       cookie al ver el parámetro. */}}
  <span class="idiomas">
    <a href="#"{{ if eq lang "es" }} class="activo" aria-current="true"{{ end }} onclick="const u=new URL(location);u.searchParams.set('lang','es');location=u;return false">ES</a><a href="#"{{ if eq lang "en" }} class="activo" aria-current="true"{{ end }} onclick="const u=new URL(location);u.searchParams.set('lang','en');location=u;return false">EN</a>
  </span>
</nav>
{{ end }}
