# Copiar a /etc/server-status/config.yaml en el servidor.
# Este archivo NO lleva secretos: los tokens van en /etc/server-status/env (modo 0600).

base: /var/lib/server-status/status.db

proc: /proc
disco: /

intervalo_muestreo: 15s
intervalo_persistencia: 1m

docker_socket: /var/run/docker.sock
docker_concurrencia: 8

probe_timeout: 10s

# Avisos. Los SECRETOS no van acá: van en /etc/server-status/env (modo 0600).
comm_tool_url: https://comm.jadd.com.ar
# uuid fijo que identifica al destinatario en comm-tool. Se genera una vez con
# uuidgen. comm-tool nunca lo interpreta: es una invariante suya.
comm_tool_user_id: ""

# Panel privado. Va atado a la IP de TAILNET: muestra todo (errores crudos,
# métricas, nombres de containers) y no puede escuchar en 0.0.0.0.
# Vacío lo apaga. En el servidor se completa con la IP real, que no entra al repo.
panel_addr: ""

# Webhook de comm-tool: puerto DISTINTO al del panel a propósito. Para que
# comm-tool lo alcance desde su container hay que abrir este puerto a la subred
# de Docker, y abrir el del panel —que muestra todo— sería regalar superficie.
webhook_addr: ""

# Portada pública: el proceso la ESCRIBE, Caddy la sirve. Vacío la apaga.
portada_path: /opt/status/public/index.html

# El watchdog se consulta a sí mismo por acá antes de latirle a Healthchecks:
# si el túnel se cae pero el proceso vive, la vuelta completa falla y no late.
url_publica: https://status.jadd.com.ar/

# Copia consistente para el backup. Se rehace a las 04:00, antes de que el
# restic de la Mac mini corra a las 04:30. Copiar el archivo vivo NO sirve:
# con WAL puede quedar a mitad de una transacción.
backup_path: /var/lib/server-status/backup/status.db

hora_resumen: 8
zona: America/Argentina/Buenos_Aires

# Cada servicio se prueba por su URL PÚBLICA, no por localhost: así el probe
# también verifica Cloudflare, el túnel y Caddy — el camino que usa la gente.
servicios:
  - nombre: sitio
    probe: https://jadd.com.ar/
    containers: [caddy, cloudflared]

  - nombre: comm-tool
    probe: https://comm.jadd.com.ar/health
    containers: [comm-tool, comm-tool-db]

  # Los Supabase no dejan pasar NADA por el gateway sin apikey, así que el
  # probe la manda en el header: `apikey_env` es el NOMBRE de la variable de
  # entorno con la anon key (el valor va en /etc/server-status/env, nunca acá).
  # Con eso alcanza /auth/v1/health, que es el healthcheck real de GoTrue y
  # responde 200. Antes se pinchaba /auth/v1/authorize esperando un 400: era el
  # único endpoint sin apikey, pero ese 400 es un error de validación y GoTrue
  # lo LOGUEA como error — un falso error por minuto, para siempre, en el log
  # que uno mira justo cuando algo anda mal.
  - nombre: study-master
    probe: https://supabase-sm.jadd.com.ar/auth/v1/health
    apikey_env: SUPABASE_SM_ANON_KEY
    containers: [supabase-kong, supabase-auth, supabase-rest, supabase-db,
                 supabase-storage, supabase-meta, supabase-imgproxy]

  - nombre: gym-tracker
    probe: https://supabase-gym.jadd.com.ar/auth/v1/health
    apikey_env: SUPABASE_GYM_ANON_KEY
    containers: [supabase-gym-kong, supabase-gym-auth, supabase-gym-rest,
                 supabase-gym-db, supabase-gym-meta, supabase-gym-studio]

  - nombre: workshop
    probe: https://workshop.jadd.com.ar/
    containers: [workshop-app, workshop-db]

# Accesos externos que el panel OFRECE en el nav y NO atiende: la terminal de
# Cockpit, la pantalla por Guacamole.
#
# Que vivan afuera es la decisión, no una comodidad. El panel no pide
# contraseña —toda su seguridad es "estás en el tailnet"— y este proceso habla
# con el socket de Docker, que equivale a root en el host. Una terminal servida
# desde acá convertiría "llegué al puerto del panel" en "tengo root", sin una
# sola credencial de por medio. Cockpit y Guacamole tienen su propio login.
#
# Las URLs van acá y no en el código porque llevan la IP de tailnet, que no
# entra a un repo público. Sin esta lista, el nav no muestra ningún enlace.
enlaces: []
#  - nombre: terminal
#    url: https://<ip-tailnet>:9090
#  - nombre: pantalla
#    url: http://<ip-tailnet>:8088
